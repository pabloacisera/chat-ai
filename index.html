<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>ChatForge</title>
    <meta name="description" content="ChatForge — Asistente de IA conversacional">
    <meta property="og:title" content="ChatForge">
    <meta property="og:description" content="Asistente de IA conversacional">
    <meta property="og:type" content="website">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="icon" href="public/img/favicon.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="public/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/css/root.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menú lateral">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main id="dashboard">
        <aside class="conversations" id="sidebar">
            <section class="buttons-section">
                <button type="button" class="new-conversation" id="new-conversation" title="Nueva conversación">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M120-160v-600q0-33 23.5-56.5T200-840h480q33 0 56.5 23.5T760-760v203q-10-2-20-2.5t-20-.5q-10 0-20 .5t-20 2.5v-203H200v400h283q-2 10-2.5 20t-.5 20q0 10 .5 20t2.5 20H240L120-160Zm160-440h320v-80H280v80Zm0 160h200v-80H280v80Zm400 280v-120H560v-80h120v-120h80v120h120v80H760v120h-80ZM200-360v-400 400Z"/>
                    </svg>
                    Nueva
                </button>
                <button type="button" id="btn-theme-toggle" class="btn-theme-toggle" title="Cambiar tema">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </section>
            <div class="search-section">
                <input type="text" id="search-conversations" placeholder="Buscar conversaciones..." class="search-input">
            </div>
            <ul class="list-conversations">
            </ul>
            <section class="user-section">
                <button type="button" class="btn-profile" id="btn-profile" title="Perfil">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M480-80q-66 0-113-47t-47-113q0-66 47-113t113-113q66 0 113 47t47 113q0 66-47 113t-113 113Zm0-213q-41 0-70.5-29.5T380-323q0-41 29.5-70.5T480-423q41 0 70.5 29.5T580-323q0 41-29.5 70.5T480-213Zm0 213Zm-252 96q-33 0-56.5-23.5T148-168v-512h-40v-80h200v-40h280v40h200v80h-40v512q0 33-23.5 56.5T732-168V-80H228Zm400-632v512-512Z"/>
                    </svg>
                    <span class="user-name">Usuario</span>
                </button>
                <button type="button" class="btn-settings" id="btn-settings" title="Configuración">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#F3F3F3">
                        <path d="M686-132 444-376q-20 8-40.5 12t-43.5 4q-100 0-170-70t-70-170q0-36 10-68.5t28-61.5l146 146 72-72-146-146q29-18 61.5-28t68.5-10q100 0 170 70t70 170q0 23-4 43.5T584-516l244 242q12 12 12 29t-12 29l-84 84q-12 12-29 12t-29-12Zm29-85 27-27-256-256q18-20 26-46.5t8-53.5q0-60-38.5-104.5T386-758l74 74q12 12 12 28t-12 28L332-500q-12 12-28 12t-28-12l-74-74q9 57 53.5 95.5T360-440q26 0 52-8t47-25l256 256ZM472-488Z"/>
                    </svg>
                </button>
            </section>
            <div class="resize-handle"></div>
        </aside>
        <section class="messages-content" id="messages-container"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="public/js/resizeAside.js" defer></script>
    <script type="module" src="public/js/index.js"></script>
</body>

</html>
