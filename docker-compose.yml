services:
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./public:/usr/share/nginx/html/public:ro
    depends_on:
      - api-express
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: postgres-chat
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Postgres puede ser intenso en disco/cpu
          memory: 256M    # Suficiente para desarrollo local
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-chatuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatpass123}
      - POSTGRES_DB=${POSTGRES_DB:-chatdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: redis-chat
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M    # Redis es ligero, esto sobra
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal

  api-express:
    build: ./packages/api-express
    container_name: api-express
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - EXPRESS_PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chatuser}:${POSTGRES_PASSWORD:-chatpass123}@postgres:5432/${POSTGRES_DB:-chatdb}
      - REDIS_URL=redis://redis:6379
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
